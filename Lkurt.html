<!DOCTYPE html>
<html lang="kS"  dir="rtl">


<head>
      <meta charset="UTF-8">

    <meta name="viewport"  content="width=device-width, initial-scale=1.0">
  <title>کورتکەرەوەی لینک - EMA tools</title>
  
  <style>
      @font-face {
font-family: 'K24Kurdish';
          src: url('K24KurdishBold-Bold.ttf');
      }

  body {
          font-family: 'K24Kurdish', sans-serif;
      background-color: #f0f2f5;
margin: 0;
          text-align: center;
  }

      header {
background-color: #2c3e50;
          color: white;
      padding: 20px;
          display: flex;
  flex-direction: column;
      align-items: center;
justify-content: center;
      }

  .header-content {
          display: flex;
      align-items: center;
gap: 15px;
  }

      .logo {
  height: 90px;
          border-radius: 5px;
      }

  header h1 {
          margin: 0;
      font-size: 2.5em;
  }

      header p {
  margin-top: 10px;
          color: #1abc9c;
      }

  nav {
          background-color: #34495e;
      padding: 15px;
  }


      nav a {
  color: white;
          text-decoration: none;
      margin: 0 15px;
font-weight: bold;
          font-size: 1.1em;
      }

  nav a:hover {
          color: #1abc9c;
  }

      .container {
  padding: 20px;
          max-width: 600px;
      margin: auto;
background: white;
          margin-top: 20px;
      border-radius: 5px;
border: 1px solid #ccc;
      }

  input {
          padding: 10px;
      width: 70%;
border: 1px solid #ccc;
          border-radius: 4px;
  }


      button {
  padding: 10px 20px;
          background: #2ecc71;
      color: white;
border: none;
          border-radius: 4px;
      cursor: pointer;
      }

  table {
          width: 100%;
      margin-top: 20px;
border-collapse: collapse;
  }

      th,
  td {
          border: 1px solid #ddd;
      padding: 10px;
text-align: right;
      }

  th {
          background-color: #f2f2f2;
  }
  </style>
</head>


<body>

  <header>
      <div class="header-content">
          <img src="ema-logo.png"   alt="EMA Logo" class="logo">
      <h1>EMA tools</h1>
      </div>
  <p>سایتێکی بچووک و خزمەتگوزاری گەورە</p>
  </header>


      <nav>
  <a href="index.html">سەرەکی</a>
          <a href="Lkurt.html">کورتکەرەوەی لینک</a>
      <a href="bio.html">ئێمە لینکس</a>
  <a href="sc.html">سکوێریتی</a>
      </nav>

  <div class="container">
      <h2>لینکی خۆت کورت بکەوە</h2>
          <input type="text"  id="longUrl" placeholder="لینکەکەت لێرە دابنێ...">
      <button id="shortenBtn">کورتکردنەوە</button>

  <h3>ئەنجام</h3>
      <table>
          <thead>
      <tr>
          <th>لینکی درێژ</th>
              <th>کۆدی کورت</th>
      </tr>
          </thead>
      <tbody id="linksList">
          </tbody>
      </table>
  </div>


      <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
          import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      var firebaseConfig = {
apiKey: "AIzaSyBX9EOw1JS3s4n5ArzECP9zFnc1m7lDaQk",
          authDomain: "ematools-proj.firebaseapp.com",
      projectId: "ematools-proj",
storageBucket: "ematools-proj.firebasestorage.app",
          messagingSenderId: "931284717297",
      appId: "1:931284717297:web:e9b19695880a7ff3a72350"
      };

  var myApp = initializeApp(firebaseConfig);
          var myDb = getFirestore(myApp);

      var getBtn = document.getElementById('shortenBtn');
  var getUrl = document.getElementById('longUrl');
          var listArea = document.getElementById('linksList');

      getBtn.addEventListener('click', async function () {
  var longLink = getUrl.value;
          if (longLink) {
      var chars = "abcdefghijklmnopqrstuvwxyz0123456789";
              var myCode = "";
      for (var i = 0; i < 5; i++) {
          // Math.random ژمارەیەک لە نێوان 0 بۆ 1 
          // Math.floor ژمارەکە دەکاتە ژمارەی تەواو فاریزە نایەلیت 
          var randomNum = Math.floor(Math.random() * chars.length);
                  myCode = myCode + chars.substring(randomNum, randomNum + 1);
      }

      // await بۆ ئەوەیە کۆدەکانی داهاتوو ڕێک ئیش نەکەن چوونکە تا داتاکە بۆ فایربەیس ئەجی کەمێ کاتی دەوێ 
              await addDoc(collection(myDb, "links"), {
      longUrl: longLink,
                  code: myCode,
          createdAt: new Date()
              });
      alert("سەرکەوتوو بوو!");
              /////// window.location.origin ئەوە دۆمەینەکە دیاری دەکا 
          var shortUrl = window.location.origin + window.location.pathname.replace('Lkurt.html', 'r.html') + '?c=' + myCode;
              var rowData = "<tr><td>" + longLink + "</td><td><a href='" + shortUrl + "' target='_blank' id='resLink'>" + shortUrl + "</a> <button onclick=\"copyUrl('" + shortUrl + "')\" style='padding:5px; margin-right:10px; background:#3498db;'>کۆپی</button></td></tr>";
      listArea.innerHTML = rowData;
              getUrl.value = "";
          } else {
      alert("تکایە لینکێک بنوسە");
          }
      });

  window.copyUrl = function (u) {
          // navigator.clipboard بۆ ئەوەیە شت کۆپی بکا   
          navigator.clipboard.writeText(u).then(function () {
      alert("لینکەکە کۆپی کرا!");
          });
  }
      </script>


  <footer>
      <p> لینکی کورت جوانییە ، ئێمەش ئەو جوانییەمان بۆ ئامادە کردوویت </p>
  </footer>

</body>

</html>
