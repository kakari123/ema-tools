<!DOCTYPE html>
<html lang="ckb" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMA tools</title>
    <style>
        @font-face {
            font-family: 'K24Kurdish';
            src: url('K24KurdishBold-Bold.ttf');
        }

        body {
            font-family: 'K24Kurdish', sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            height: 90px;
            border-radius: 5px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
        }

        header p {
            margin-top: 10px;
            color: #1abc9c;
        }

        nav {
            background-color: #34495e;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 1.1em;
        }

        nav a:hover {
            color: #1abc9c;
        }

        .login-box {
            background: white;
            padding: 30px;
            max-width: 400px;
            margin: 50px auto;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input {
            display: block;
            width: 90%;
            padding: 10px;
            margin: 15px auto;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 95%;
            font-weight: bold;
        }

        button:hover {
            background: #27ae60;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <img src="ema-logo.png" alt="EMA Logo" class="logo">
            <h1>EMA tools</h1>
        </div>
        <p>سایتێکی بچووک و خزمەتگوزاری گەورە</p>
    </header>

    <nav>
        <a href="index.html">سەرەکی</a>
        <a href="Lkurt.html">کورتکەرەوەی لینک</a>
        <a href="bio.html">ئێمە لینکس</a>
        <a href="sc.html">سکوێریتی</a>
    </nav>

    <div class="login-box">
        <div id="signupForm">
            <h2>هەژمارێکی نوێ دروست بکە</h2>
            <input type="email" id="myEmail" placeholder="ئیمەیڵ بنووسە...">
            <input type="password" id="myPass" placeholder="پاسۆرد بنووسە...">
            <button id="signupBtn">دروستکردنی هەژمار</button>
            <p>هەژمارت هەیە؟ <a href="log.html">بچۆ ژوورەوە</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        var firebaseConfig = {
            apiKey: "AIzaSyBX9EOw1JS3s4n5ArzECP9zFnc1m7lDaQk",
            authDomain: "ematools-proj.firebaseapp.com",
            projectId: "ematools-proj",
            storageBucket: "ematools-proj.firebasestorage.app",
            messagingSenderId: "931284717297",
            appId: "1:931284717297:web:e9b19695880a7ff3a72350"
        };

        var myApp = initializeApp(firebaseConfig);
        var myAuth = getAuth(myApp);

        var emailBox = document.getElementById('myEmail');
        var passBox = document.getElementById('myPass');
        var signupBtn = document.getElementById('signupBtn');

        signupBtn.addEventListener('click', function () {
            var emailVal = emailBox.value;
            var passVal = passBox.value;


            if (emailVal && passVal) { 
                createUserWithEmailAndPassword(myAuth, emailVal, passVal)
                    .then(function (result) { 
                        alert("هەژمارەکەت بە سەرکەوتوویی دروست کرا!"); 
                        window.location.href = "log.html"; 
                    });
            } else { // ئەگەر بە بەتاڵ بوون 
                alert('تکایە ئیمەیڵ و پاسۆرد بپڕ بکەرەوە'); 
            }
        });
    </script>

</body>

</html>
