<!DOCTYPE html> 
<html lang="ckb" dir="rtl">

<head>
  <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چوونەژوورەوە - EMA tools</title> 

  <style>
      @font-face {
font-family: 'K24Kurdish';
          src: url('K24KurdishBold-Bold.ttf');
      }

  body {
font-family: 'K24Kurdish', sans-serif;
          background-color: #f4f4f4;
      text-align: center;
margin: 0;
          padding: 0;
  }


      header {
  background-color: #2c3e50;
          color: white;
      padding: 20px;
display: flex;
          flex-direction: column;
  align-items: center;
      justify-content: center;
      }

  .header-content {
          display: flex;
      align-items: center;
gap: 15px;
  }

      .logo {
  height: 90px;
          border-radius: 5px;
      }

  header h1 {
          margin: 0;
      font-size: 2.5em;
  }

      header p {
  margin-top: 10px;
          color: #1abc9c;
      }

  nav {
          background-color: #34495e;
      padding: 15px;
  }

      nav a {
  color: white;
          text-decoration: none;
      margin: 0 15px;
font-weight: bold;
          font-size: 1.1em;
      }

  nav a:hover {
          color: #1abc9c;
  }


      .login-box {
  background: white;
          padding: 30px;
      max-width: 400px;
margin: 50px auto;
          border-radius: 5px;
  border: 1px solid #ccc;
      }

  input {
          display: block;
      width: 90%;
padding: 10px;
          margin: 15px auto;
  border: 1px solid #ccc;
      border-radius: 4px;
      }


  button {
          background: #3498db;
      color: white;
border: none;
          padding: 12px 20px;
  border-radius: 4px;
      cursor: pointer;
width: 95%;
          font-weight: bold;
      }

  button:hover {
          background: #2980b9;
  }


      #logoutBtn {
  background: #e74c3c;
          margin-top: 20px;
      display: none;
  }

  </style>
</head>


<body>

  <header>
      <div class="header-content">
          <img src="ema-logo.png"   alt="EMA Logo" class="logo">
      <h1>EMA tools</h1>
      </div>
  <p>سایتێکی بچووک و خزمەتگوزاری گەورە</p>
  </header>


      <nav>
  <a href="index.html">سەرەکی</a>
          <a href="Lkurt.html">کورتکەرەوەی لینک</a>
      <a href="bio.html">ئێمە لینکس</a>
  <a href="sc.html">سکوێریتی</a>
      </nav>

  <div class="login-box">
    <img src="ema-logo.png"  class="logo" alt="Logo">
        <h2>چوونەژوورەوە</h2>
      <div id="loginForm">
  <input type="email" id="myEmail" placeholder="ئیمێڵ...">
          <input type="password" id="myPass" placeholder="پاسۆرد...">
      <button id="loginBtn">چوونە ژوورەوە </button>
  <p style="margin-top:20px;">هەژمارت نییە؟ <a href="sigup.html">دروستکردنی هەژمار</a></p>
      </div>
  <button id="logoutBtn" style="background-color: #e74c3c; display: none; width: 95%; margin: 10px auto;">چوونەدەرەوە (Logout)</button>
      <p id="userMsg" style="color: #2c3e50; font-weight: bold; margin-top: 10px;"></p>
  </div>


      <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
          import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

   var firebaseConfig = {
          apiKey: "AIzaSyBX9EOw1JS3s4n5ArzECP9zFnc1m7lDaQk",
          authDomain: "ematools-proj.firebaseapp.com",
          projectId: "ematools-proj",
          storageBucket: "ematools-proj.firebasestorage.app",
          messagingSenderId: "931284717297",
          appId: "1:931284717297:web:e9b19695880a7ff3a72350"
      };

  var myApp = initializeApp(firebaseConfig);
          var myAuth = getAuth(myApp);

        var emailBox = document.getElementById('myEmail');
        var passBox = document.getElementById('myPass');
        var loginBtn = document.getElementById('loginBtn');
        var logoutBtn = document.getElementById('logoutBtn');
        var userMsg = document.getElementById('userMsg');
        var loginForm = document.getElementById('loginForm');
 
        // چێک کردن  هەتا بزانین کەسەکە لۆگئین بێت یان نا
        onAuthStateChanged(myAuth, function (myUser) {
            if (myUser) { // ئەگەر لۆگئین بوو
                // ئەم بلۆک و نەن ە هی جەی ئێس نییە بە ئەسڵ بەلکوو هی فایر بەیە 
                loginForm.style.display = "none"; 
                logoutBtn.style.display = "block"; 
                userMsg.innerText = "بەخێربێیت " + myUser.email;
            } else { // ئەگەر لۆگئاوت یان چوونەدەرەوە بوو
                loginForm.style.display = "block";
                logoutBtn.style.display = "none";
                userMsg.innerText = ""; 
      }
  });


      loginBtn.addEventListener('click', function () {
  var emailVal = emailBox.value;
          var passVal = passBox.value;
// then واتا ئەگەر ئەوەی سەرەوە راست بوو ئەوجار ئەمەم بۆ بکە 
      if (emailVal && passVal) { 
  signInWithEmailAndPassword(myAuth, emailVal, passVal)
          .then(function (result) {
      window.location.href = "bio.html";
  })


  // catch واتا ئەگەر ئەوەی سەرەوە هەڵە بوو ئەوجار ئەمەم بۆ بکە 
          .catch(function(error) {
      alert("ئیمێل و پاسۆردەکەت دڵنیا بکەرەوە: " );
  });
          } else {
      alert("تکایە ئیمەیڵ و پاسۆرد بنووسە");
          }
  });


      logoutBtn.addEventListener('click', function () {
  signOut(myAuth).then(function () {
          alert("چوویتە دەرەوە");
      });
  });
      </script>

</body>
</html>
